# Paste into a dashboard: Edit dashboard -> ⋮ -> Raw configuration editor (as one view under `views:`)
title: Ski
path: ski
icon: mdi:ski
cards:
  - type: entities
    title: Ski Conditions
    entities:
      - number.ski_conditions_update_interval
      - button.ski_conditions_refresh_now
  - type: glance
    title: Fresh snow 24h
    columns: 3
    entities:
      - entity: sensor.sunshine_village_snowfall_24h
        name: Sunshine Village
      - entity: sensor.lake_louise_snowfall_24h
        name: Lake Louise
      - entity: sensor.panorama_snowfall_24h
        name: Panorama
      - entity: sensor.kicking_horse_snowfall_24h
        name: Kicking Horse
      - entity: sensor.fernie_snowfall_24h
        name: Fernie
      - entity: sensor.castle_mountain_snowfall_24h
        name: Castle Mountain
  - type: glance
    title: Forecast snow next 24h
    columns: 3
    entities:
      - entity: sensor.sunshine_village_forecast_snowfall_next_24h
        name: Sunshine Village
      - entity: sensor.lake_louise_forecast_snowfall_next_24h
        name: Lake Louise
      - entity: sensor.panorama_forecast_snowfall_next_24h
        name: Panorama
      - entity: sensor.kicking_horse_forecast_snowfall_next_24h
        name: Kicking Horse
      - entity: sensor.fernie_forecast_snowfall_next_24h
        name: Fernie
      - entity: sensor.castle_mountain_forecast_snowfall_next_24h
        name: Castle Mountain
  - type: vertical-stack
    cards:
      - type: weather-forecast
        entity: weather.sunshine_village_summit_weather
        name: Sunshine Village
        forecast_type: hourly
      - type: entities
        entities:
          - entity: sensor.sunshine_village_base_depth
            name: Base
          - entity: sensor.sunshine_village_summit_depth
            name: Summit
          - entity: sensor.sunshine_village_powder_depth
            name: Powder
          - entity: sensor.sunshine_village_snowfall_24h
            name: 24 h snowfall
          - entity: sensor.sunshine_village_summit_temperature
            name: Summit temp
          - entity: sensor.sunshine_village_base_temperature
            name: Base temp
          - entity: sensor.sunshine_village_wind_speed
            name: Wind
          - entity: sensor.sunshine_village_wind_gust
            name: Gusts
          - entity: sensor.sunshine_village_forecast_next_24h
            name: Next 24 h
          - entity: sensor.sunshine_village_lifts_open
            name: Lifts open
          - entity: sensor.sunshine_village_report_date
            name: Reported
  - type: vertical-stack
    cards:
      - type: weather-forecast
        entity: weather.lake_louise_summit_weather
        name: Lake Louise
        forecast_type: hourly
      - type: entities
