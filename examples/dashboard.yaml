            name: Summit
          - entity: sensor.lake_louise_powder_depth
            name: Powder
          - entity: sensor.lake_louise_snowfall_24h
            name: 24 h snowfall
          - entity: sensor.lake_louise_summit_temperature
            name: Summit temp
          - entity: sensor.lake_louise_base_temperature
            name: Base temp
          - entity: sensor.lake_louise_wind_speed
            name: Wind
          - entity: sensor.lake_louise_wind_gust
            name: Gusts
          - entity: sensor.lake_louise_forecast_next_24h
            name: Next 24 h
          - entity: sensor.lake_louise_lifts_open
            name: Lifts open
          - entity: sensor.lake_louise_report_date
            name: Reported
