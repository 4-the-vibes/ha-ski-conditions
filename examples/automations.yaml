# Add via Settings -> Automations -> Create -> ⋮ Edit in YAML (one automation at a time),
# or paste the list into automations.yaml. Replace notify.mobile_app_phone with your notifier.
# Both work with whatever resorts you've added (they find the sensors by name).

- alias: "Ski: powder day alert"
  triggers:
    - trigger: time
      at: "06:30:00"
  variables:
    snow: >
      {% set ns = namespace(r=[]) %}
      {% for s in states.sensor | selectattr('entity_id', 'search', '_snowfall_24h$') if s.state | is_number %}
        {% set ns.r = ns.r + [{'name': s.name | replace(' Snowfall 24h', ''), 'cm': s.state | float}] %}
      {% endfor %}
      {{ ns.r }}
  conditions:
    - condition: template
      value_template: "{{ (snow | map(attribute='cm') | list + [0]) | max >= 15 }}"
  actions:
    - action: notify.mobile_app_phone
      data:
        title: "Powder day ❄️"
        message: >
          {% for s in snow | sort(attribute='cm', reverse=true) if s.cm >= 5 %}
          {{ s.name }}: {{ s.cm }} cm
          {% endfor %}

- alias: "Ski: poll faster when a storm is forecast"
  triggers:
    - trigger: time_pattern
      hours: "/3"
  actions:
    - action: number.set_value
      target:
        entity_id: number.ski_conditions_update_interval
      data:
        value: >
          {{ 15 if (states.sensor
                    | selectattr('entity_id', 'search', '_forecast_snowfall_next_24h$')
                    | map(attribute='state') | map('float', 0) | list + [0]) | max >= 10 else 60 }}
